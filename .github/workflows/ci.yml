name: Footlink CI - Governance & Backend Tests

on:
  push:
    branches: [ main, develop, "feature/**", "hotfix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-tasks-schema:
    name: Validate C-Suite Task Objects (JSON Schema v1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema validator
        run: pip install jsonschema referencing

      - name: Validate 3-Pillar Root Structure & Azienda/tasks/*.json against task-object-v1.schema.json
        run: |
          python3 -c '
          import glob, json, os, sys
          from jsonschema import validate, ValidationError, Draft202012Validator

          for pillar in ("Azienda", "Applicativo", "Portale_Founder_Control"):
              if not os.path.isdir(pillar):
                  print(f"ERROR: Missing required root pillar directory: {pillar}/")
                  sys.exit(1)

          schema_path = "Azienda/tasks/schema/task-object-v1.schema.json"
          with open(schema_path, "r", encoding="utf-8") as sf:
              schema = json.load(sf)

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          task_files = sorted(
              glob.glob("Azienda/tasks/FTL-*.json")
              + glob.glob("Azienda/tasks/archive_epoch_1/FTL-*.json")
          )
          if not task_files:
              print("ERROR: No task files found in Azienda/tasks/ or Azienda/tasks/archive_epoch_1/")
              sys.exit(1)

          errors = 0
          for path in task_files:
              with open(path, "r", encoding="utf-8") as tf:
                  data = json.load(tf)
              file_errors = list(validator.iter_errors(data))
              if file_errors:
                  errors += len(file_errors)
                  for err in file_errors:
                      print(f"FAIL: {path}: {err.message}")
              else:
                  tid = data.get("task_id")
                  tst = data.get("status")
                  print(f"OK: {path} ({tid} -> status={tst})")

          if errors > 0:
              sys.exit(1)
          print(f"SUCCESS: Validated {len(task_files)} task files across Epoch 1 & Epoch 2 with 0 errors.")
          '

  backend-tests:
    name: Backend Unit & Domain Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Applicativo/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite (1:N PIM-PLM, Multi-level BOM & EU DPP)
        run: python3 -m pytest -v
        env:
          PYTHONPATH: .
