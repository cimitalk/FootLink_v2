name: Footlink CI - Governance & Backend Tests

on:
  push:
    branches: [ main, develop, "feature/**", "hotfix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-tasks-schema:
    name: Validate C-Suite Task Objects (JSON Schema v1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema validator
        run: pip install jsonschema referencing

      - name: Validate all tasks/*.json against task-object-v1.schema.json
        run: |
          python3 -c '
          import glob, json, sys
          from jsonschema import validate, ValidationError, Draft202012Validator

          with open("tasks/schema/task-object-v1.schema.json", "r", encoding="utf-8") as sf:
              schema = json.load(sf)

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          task_files = sorted(glob.glob("tasks/*.json"))
          if not task_files:
              print("ERROR: No task files found in tasks/*.json")
              sys.exit(1)

          errors = 0
          for path in task_files:
              with open(path, "r", encoding="utf-8") as tf:
                  data = json.load(tf)
              file_errors = list(validator.iter_errors(data))
              if file_errors:
                  errors += len(file_errors)
                  for err in file_errors:
                      print(f"FAIL: {path}: {err.message}")
              else:
                  print(f"OK: {path} ({data.get(\"task_id\")} -> status={data.get(\"status\")})")

          if errors > 0:
              sys.exit(1)
          print(f"SUCCESS: Validated {len(task_files)} task files with 0 errors.")
          '

  backend-tests:
    name: Backend Unit & Domain Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite (1:N PIM-PLM, Multi-level BOM & EU DPP)
        run: pytest -v
